title: DSA Java Articles
description: Java solutions with brute-force to optimal explanations for every problem in Striver's A2Z, SDE and Blind 75 sheets.
url: "https://udhayakumar-gj.github.io"
baseurl: "/dsa-java-articles"
repo_url: "https://github.com/udhayakumar-Gj/dsa-java-articles"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false
plugins:
  - jekyll-seo-tag
exclude:
  - tools
  - data
  - out
  - README.md
  - ARTICLE_GUIDE.md
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: "p"
    values:
      layout: article
  - scope:
      path: ""
    values:
      layout: default
